name: ascend
description: ASCEND - Earn Your Elevation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  image_picker: ^1.1.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ascend_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/ascend_icon.png
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/ascend_icon.png
