name: Build ASCEND APK

on:
  push:
    branches:
      - main
      - ascend-development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create . --project-name ascend --org com.ascend.app --platforms=android

      - name: Set ASCEND app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="ASCEND"', s, count=1)
          p.write_text(s)
          PY
      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          flag = "isCoreLibraryDesugaringEnabled = true"
          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'

          if flag not in s:
              pattern = r'compileOptions\s*\{'
              if re.search(pattern, s):
                  s = re.sub(pattern, lambda m: m.group(0) + "\n        " + flag, s, count=1)
              else:
                  s = re.sub(r'android\s*\{', lambda m: m.group(0) + "\n    compileOptions {\n        " + flag + "\n    }", s, count=1)

          if dep not in s:
              pattern = r'dependencies\s*\{'
              if re.search(pattern, s):
                  s = re.sub(pattern, lambda m: m.group(0) + "\n    " + dep, s, count=1)
              else:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"

          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ASCEND.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASCEND-APK
          path: build/app/outputs/flutter-apk/ASCEND.apk
          
